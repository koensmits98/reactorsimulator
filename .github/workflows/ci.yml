name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reactor:reactor@localhost:5432/reactor
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  deploy:
    # Only on pushes to main, and only if lint and tests passed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Never run two deploys at the same time; a newer one waits for the older one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      # Re-running an old workflow would otherwise put old code back on the server.
      - name: Skip if this is not the newest commit on main
        id: newest
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main is now at $LATEST; not deploying older commit $GITHUB_SHA"
          fi

      - uses: docker/login-action@v3
        if: steps.newest.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: steps.newest.outputs.deploy == 'true'
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER/reactor-backend:latest backend
          docker build -t ghcr.io/$OWNER/reactor-web:latest -f deploy/Dockerfile.caddy .
          docker push ghcr.io/$OWNER/reactor-backend:latest
          docker push ghcr.io/$OWNER/reactor-web:latest

      - name: Deploy over SSH
        if: steps.newest.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_deploy $USER_NAME@$HOST"
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml $USER_NAME@$HOST:~/reactor/docker-compose.yml
          $SSH "cd ~/reactor && docker compose pull && docker compose up -d && docker image prune -f"
