# Local development: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reactor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reactor}
      POSTGRES_DB: reactor
    # Low-memory settings, same as production. No "ports:" on purpose: the database
    # is only reachable from other containers on this compose network.
    command: postgres -c shared_buffers=32MB -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://reactor:${POSTGRES_PASSWORD:-reactor}@db:5432/reactor
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
    depends_on:
      - backend

volumes:
  pgdata:
